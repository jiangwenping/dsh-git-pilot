# Mount the Git pilot into a DSH profile. A profile's final patch may replace
# this config row as a whole; use user settings or the plugin manager for
# one-field overrides.
- insert:
    - id: git-pilot
      name: dsh-git-pilot
      config:
        enabled: true
        branchChip: true
        # Off by intent: the dock row duplicates the composer chip's branch
        # entry; the chip also carries the dirty badge and Changes shortcut.
        composerBranchRow: false
        changesPanel: true
        # Off by choice: the panel is opened from the chip badge, the guide
        # card, or the sidebar tab strip — never on its own. A long-lived
        # uncommitted worktree would otherwise pop it open for every session.
        autoOpenChanges: never
        remoteBranches: false
        autoFetch: false
        timeoutMs: 10000
        maxBranches: 200
        maxFiles: 500
        maxFileBytes: 2097152
        branchNameTemplate: feature/YYYYMMDD-
        protectedBranches:
          - master
          - main
          - release/*
